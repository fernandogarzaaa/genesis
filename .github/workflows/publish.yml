name: Publish to npm

# Runs only when a version tag (vX.Y.Z) is pushed. Publishes only when an
# NPM_TOKEN repository secret (automation token with publish rights to
# genesis-assurance) is set; without it the run succeeds and skips publishing.
# Publishes with npm provenance, so the package links back to this workflow run.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write # required for npm --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Skip if this version is already on npm or no NPM_TOKEN is configured
        id: exists
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          if npm view "$PKG" version >/dev/null 2>&1; then
            echo "$PKG is already published; nothing to do."
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif [ -z "${NPM_TOKEN}" ]; then
            # No secret (e.g. the package is published by hand): succeed
            # without publishing instead of failing the tag run.
            echo "::notice::NPM_TOKEN secret is not set; skipping npm publish of $PKG."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.published == 'false'
        run: npm ci

      - if: steps.exists.outputs.published == 'false'
        run: |
          npm run typecheck
          npm run lint
          npm run test
          npm run build
          node bin/genesis.js --help

      - if: steps.exists.outputs.published == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
