name: notify-godmode
# Notifies fernandogarzaaa/godmode to re-vendor this repo (see godmode/docs/auto-update.md).
# Requires secret GODMODE_SYNC_TOKEN in this repo (PAT with write on godmode).
on:
  push:
    branches: [main]
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # Pinned to full commit SHA (v3 tag): mutable major tags + write PAT = takeover path.
      - uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.GODMODE_SYNC_TOKEN }}
          repository: fernandogarzaaa/godmode
          event-type: source-updated
          client-payload: '{"repo": "genesis", "sha": "${{ github.sha }}"}'
